name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # מפעיל את הבנייה כשהקוד מתעדכן
  workflow_dispatch: # מאפשר הפעלה ידנית

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genetic-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genetic-app-apk
          path: genetic-app/android/app/build/outputs/apk/debug/app-debug.apk
