name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -d "genetic-app" ]; then cd genetic-app; fi
          npm install

      - name: Build Web App
        run: |
          if [ -d "genetic-app" ]; then cd genetic-app; fi
          npm run build

      - name: Sync Capacitor
        run: |
          if [ -d "genetic-app" ]; then cd genetic-app; fi
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -d "genetic-app/android" ]; then cd genetic-app/android; else cd android; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genetic-app-apk
          path: |
            genetic-app/android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
